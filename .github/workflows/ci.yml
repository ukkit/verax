name: CI

# Full check: typecheck, tests, build, dependency audit. Skipped for docs-only changes; the
# personal-data scan lives in scan.yml and always runs, so docs are still covered.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - .gitignore
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - .gitignore

permissions:
  contents: read

# A newer push to the same PR cancels the older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
